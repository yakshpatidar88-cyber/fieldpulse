services:
  # Spring Boot 3 Java 21 Backend Web Service
  - type: web
    name: fieldpulse-api
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: starter
    healthCheckPath: /api/v1/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: PORT
        value: 8080
      - key: JWT_SECRET
        generateValue: true
      - key: DB_HOST
        fromDatabase:
          name: fieldpulse-postgres
          property: host
      - key: DB_PORT
        fromDatabase:
          name: fieldpulse-postgres
          property: port
      - key: DB_NAME
        fromDatabase:
          name: fieldpulse-postgres
          property: database
      - key: DB_USER
        fromDatabase:
          name: fieldpulse-postgres
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: fieldpulse-postgres
          property: password
      - key: REDIS_HOST
        fromService:
          type: redis
          name: fieldpulse-redis
          property: host
      - key: REDIS_PORT
        fromService:
          type: redis
          name: fieldpulse-redis
          property: port
      - key: REDIS_PASSWORD
        fromService:
          type: redis
          name: fieldpulse-redis
          property: password

  # Redis 7 In-Memory Cache and Pub/Sub Broker
  - type: redis
    name: fieldpulse-redis
    plan: starter
    maxmemoryPolicy: allkeys-lru

databases:
  # Managed PostgreSQL 16 Database
  - name: fieldpulse-postgres
    plan: starter
    postgresMajorVersion: 16
    databaseName: fieldpulse
    user: fieldpulse
