version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: fieldpulse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: fieldpulse
      POSTGRES_USER: fieldpulse
      POSTGRES_PASSWORD: fieldpulse_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fieldpulse -d fieldpulse"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - fieldpulse-network

  redis:
    image: redis:7-alpine
    container_name: fieldpulse-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - fieldpulse-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fieldpulse-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: fieldpulse
      DB_USER: fieldpulse
      DB_PASSWORD: fieldpulse_dev_password
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    ports:
      - "8080:8080"
    networks:
      - fieldpulse-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fieldpulse-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"
    networks:
      - fieldpulse-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  fieldpulse-network:
    driver: bridge
